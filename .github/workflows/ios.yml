name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the web page
        run: npm run build:web

      - name: Create the iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Set icon and orientation
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ICON=$(ls "$ICONSET"/*.png | head -1)
          cp assets/icon-1024.png "$ICON"
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Delete :UISupportedInterfaceOrientations' "$PLIST" || true
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UIStatusBarHidden bool true' "$PLIST" || true
          /usr/libexec/PlistBuddy -c 'Set :UIViewControllerBasedStatusBarAppearance false' "$PLIST" || \
            /usr/libexec/PlistBuddy -c 'Add :UIViewControllerBasedStatusBarAppearance bool false' "$PLIST"

      - name: Compile without signing
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry FindTheSpace-unsigned.ipa Payload
          ls -lh FindTheSpace-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FindTheSpace-unsigned-ipa
          path: FindTheSpace-unsigned.ipa
          if-no-files-found: error
