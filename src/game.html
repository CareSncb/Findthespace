<title>Find the Space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: a floodlit stadium at night. Setup is a four-step walk to the pitch; the match is a TV broadcast with the decision under the thumb. */
:root{
  color-scheme:dark;
  --night:#091327; --panel:#14233f; --panel-2:#1f3459; --line:#33507f; --chalk:#f8f7ef; --muted:#b4c4dc;
  --red:#e0212f; --red-deep:#8f1320; --ink:#0b0f18; --gold:#ffc928; --gold-deep:#a97f00;
  --open:#ffc928; --dicht:#7fe7ea; --good:#74e08a; --bad:#ff8d7d; --grass:#27864a;
  --display:"Lilita One","Arial Black",Impact,sans-serif;
  --body:"Andika","Trebuchet MS",Verdana,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% -5%,#2a4678 0%,#101f3b 45%,var(--night) 100%);background-color:var(--night);color:var(--chalk);font-family:var(--body);font-size:18px;line-height:1.35;overflow:hidden;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:10px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,p{margin:0}
.screen{height:100%;max-width:640px;margin:0 auto}

/* Setup */
#setup{display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.icon-btn{background:var(--panel);border-radius:12px;min-width:46px;height:46px;font-weight:700;flex:none;border:1px solid var(--line)}
.steps{flex:1;display:flex;gap:6px;min-width:0}
.steps i{flex:1;height:8px;border-radius:5px;background:var(--panel-2)}
.steps i.on{background:var(--gold)}
.step{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,72px);line-height:.95;text-wrap:balance;overflow-wrap:anywhere}
h1 em{font-style:normal;color:var(--gold)}
.step h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,8.5vw,42px);line-height:1.02;text-wrap:balance}
.lead{color:var(--muted)}
label{font-weight:700;display:block;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:24px;font-weight:700;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--ink);color:var(--chalk)}
input::placeholder{color:#7f92b0;font-weight:400}
.err{color:var(--bad);font-weight:700;min-height:1.3em}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:4px;border:1px solid var(--line)}
.seg button{background:none;padding:7px 15px;border-radius:9px;font-weight:700;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--ink)}
.cta{font-family:var(--display);font-size:27px;padding:15px;border-radius:14px;background:var(--red);box-shadow:0 6px 0 var(--red-deep);margin-top:auto;width:100%}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-deep)}
.cta:disabled{background:var(--panel-2);box-shadow:none;color:var(--muted);cursor:default}
.formats{display:flex;flex-direction:column;gap:10px}
.fmt{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:9px}
.fmt:hover{border-color:var(--gold)}
.fmt svg{width:96px;height:auto;display:block;border-radius:7px}
.fmt strong{font-family:var(--display);font-weight:400;font-size:29px;display:block;line-height:1}
.fmt small{font-size:16px;color:var(--muted)}
.picker{position:relative;width:min(100%,48dvh);margin:0 auto;aspect-ratio:100/118;border-radius:12px;overflow:hidden;flex:none;border:2px solid #ffffffaa;
  background:repeating-linear-gradient(0deg,#2a8d4f 0 10%,#267f47 10% 20%)}
.picker svg{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;transform:translate(-50%,-50%);background:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:58px;min-height:44px;padding:0}
.spot b{width:32px;height:32px;border-radius:50%;background:var(--red);border:2px solid #fff;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:16px;box-shadow:0 2px 3px #0008}
.spot span{font-size:11.5px;font-weight:700;line-height:1;text-shadow:0 1px 2px #000;white-space:nowrap}
.spot[aria-pressed="true"] b{background:var(--gold);color:var(--ink);transform:scale(1.2);box-shadow:0 0 0 4px #ffc92866,0 2px 3px #0008}
.role-info{background:var(--panel);border-radius:12px;padding:10px 12px;min-height:76px}
.role-info strong{font-family:var(--display);font-weight:400;font-size:23px;display:block;line-height:1.1}
.levels{display:flex;flex-direction:column;gap:9px}
.level{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--red);padding:11px 13px;border-radius:14px;box-shadow:0 5px 0 var(--red-deep)}
.level:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-deep)}
.level .num{font-family:var(--display);font-size:34px;line-height:1;text-align:center}
.level strong{font-family:var(--display);font-weight:400;font-size:24px;display:block;line-height:1.05}
.level small{font-size:15px;display:block}
.stars{font-size:19px;letter-spacing:1px;white-space:nowrap;color:var(--gold)}
.summary{background:var(--panel);border-radius:12px;padding:9px 12px;font-weight:700}

/* Match */
#play{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:6px}
.board{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:center;background:linear-gradient(180deg,#1b2d50,#0d1729);border:1px solid var(--line);border-radius:12px;padding:5px 6px}
.board .icon-btn{min-width:42px;height:42px}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto auto minmax(0,1fr);align-items:center;gap:6px;font-family:var(--display);min-width:0}
.score .team{font-size:17px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.score .home-t{text-align:right;color:#ff8089}.score .away-t{color:#8fbbff}
.score .n{font-size:31px;line-height:1;background:var(--chalk);color:var(--ink);border-radius:7px;min-width:34px;text-align:center;padding:2px 4px;font-variant-numeric:tabular-nums}
.meter{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.chip{font-weight:700;font-size:14px;color:var(--gold);white-space:nowrap;max-width:58vw;overflow:hidden;text-overflow:ellipsis}
.timer{height:13px;background:#ffffff1c;border-radius:8px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--good);transform-origin:left;border-radius:8px}
.pitch-wrap{position:relative;min-height:0;border-radius:12px;overflow:hidden}
canvas{position:absolute;inset:0;display:block;touch-action:none;cursor:pointer}
.banner{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(24px,7vw,36px);padding:7px 18px;border-radius:12px;white-space:nowrap;pointer-events:none;background:var(--chalk);color:var(--ink);max-width:94%;overflow:hidden;text-overflow:ellipsis}
.banner.big{font-size:clamp(52px,18vw,96px);background:var(--red);color:var(--chalk);box-shadow:0 7px 0 var(--ink)}
.dock{min-height:128px;display:flex;flex-direction:column;justify-content:center;gap:7px}
.prompt{text-align:center;font-weight:700;font-size:20px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{font-family:var(--display);font-size:32px;color:var(--ink);padding:17px 6px;border-radius:14px;line-height:1}
.choice.o{background:linear-gradient(180deg,#ffe067,var(--open));box-shadow:0 5px 0 var(--gold-deep)}
.choice.d{background:linear-gradient(180deg,#b6f6f7,var(--dicht));box-shadow:0 5px 0 #2f9396}
.choice:active{transform:translateY(4px);box-shadow:none}
.feedback{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center}
.feedback h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;overflow-wrap:anywhere}
.feedback p{grid-column:1;font-size:17.5px}
.feedback.good h2{color:var(--good)}.feedback.close h2{color:var(--open)}.feedback.bad h2{color:var(--bad)}
.go{grid-column:2;grid-row:1/3;background:var(--chalk);color:var(--ink);font-family:var(--display);font-size:20px;border-radius:12px;padding:14px 13px;min-height:52px}

/* Result */
#result{display:flex;flex-direction:column;justify-content:center;gap:13px;text-align:center;overflow-y:auto}
#result h2{font-family:var(--display);font-weight:400;font-size:clamp(44px,13vw,70px);line-height:1}
.final{font-family:var(--display);font-size:clamp(30px,9vw,44px);overflow-wrap:anywhere}
#rStars{font-size:50px;color:var(--gold);letter-spacing:4px}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tally div{background:var(--panel);border-radius:12px;padding:10px;font-weight:700}
.tally b{display:block;font-family:var(--display);font-weight:400;font-size:31px;font-variant-numeric:tabular-nums}
.tally .o b{color:var(--open)}.tally .d b{color:var(--dicht)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font-family:var(--display);font-size:20px;padding:13px 8px;border-radius:12px;background:var(--panel-2)}
.btn.main{background:var(--red);box-shadow:0 5px 0 var(--red-deep)}

@media (orientation:landscape) and (max-height:560px){
  .screen{max-width:none}
  #play{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .pitch-wrap{grid-column:1;grid-row:1/4}
  .board{grid-column:2;grid-row:1}.meter{grid-column:2;grid-row:2}.dock{grid-column:2;grid-row:3}
  .picker{width:min(100%,62dvh)}
}
</style>

<section id="setup" class="screen">
  <div class="top">
    <button class="icon-btn" id="back" aria-label="Terug" data-fr-aria="Retour" hidden>←</button>
    <div class="steps" id="steps" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button class="icon-btn" id="soundHome" aria-label="Geluid aan of uit" data-fr-aria="Son activé ou coupé">🔊</button>
  </div>

  <div class="step" id="s1">
    <h1>Find the <em>Space</em><span id="heroName" hidden></span></h1>
    <p class="lead" data-fr="Joue à ta place. Décide vite. Apprends à bien te placer.">Speel op jouw plek. Beslis snel. Leer goed staan.</p>
    <div>
      <label for="nameInput" data-fr="Comment tu t’appelles ?">Hoe heet jij?</label>
      <input type="text" id="nameInput" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Je naam" data-fr-ph="Ton prénom">
    </div>
    <div>
      <label for="clubInput" data-fr="Ton équipe (si tu veux)">Jouw ploeg (als je wil)</label>
      <input type="text" id="clubInput" maxlength="10" autocomplete="off" spellcheck="false" placeholder="Thuis" data-fr-ph="Nous">
    </div>
    <div class="row">
      <strong data-fr="Langue">Taal</strong>
      <div class="seg">
        <button id="langNl" aria-pressed="true" lang="nl">Vlaams</button>
        <button id="langFr" aria-pressed="false" lang="fr">Français</button>
      </div>
    </div>
    <p class="err" id="nameErr" role="alert"></p>
    <button class="cta" id="toFormat" data-fr="Continuer">Verder</button>
  </div>

  <div class="step" id="s2" hidden>
    <h2 data-fr="Quel match joues-tu ?">Welke match speel jij?</h2>
    <div class="formats" id="formats"></div>
  </div>

  <div class="step" id="s3" hidden>
    <h2 data-fr="Touche ta place">Tik op jouw plek</h2>

    <div class="role-info" id="roleInfo"></div>
    <button class="cta" id="toLevel" data-fr="Continuer" disabled>Verder</button>
  </div>

  <div class="step" id="s4" hidden>
    <h2 data-fr="Choisis ton défi">Kies je match</h2>
    <p class="summary" id="summary"></p>
    <div class="levels" id="levels"></div>
    <div class="row">
      <strong data-fr="Vitesse">Snelheid</strong>
      <div class="seg">
        <button id="tempoSlow" aria-pressed="false" data-fr="Calme">Rustig</button>
        <button id="tempoMatch" aria-pressed="true">Match</button>
      </div>
    </div>
  </div>
</section>

<section id="play" class="screen" hidden>
  <div class="board">
    <button class="icon-btn" id="quit" aria-label="Stop de match" data-fr-aria="Arrêter le match">✕</button>
    <div class="score"><span class="team home-t" id="tHome"></span><span class="n" id="sHome">0</span><span class="n" id="sAway">0</span><span class="team away-t" data-fr="ADV">GAST</span></div>
    <button class="icon-btn" id="soundPlay" aria-label="Geluid aan of uit" data-fr-aria="Son activé ou coupé">🔊</button>
  </div>
  <div class="meter"><span class="chip" id="chip"></span><div class="timer"><i id="timeBar"></i></div></div>
  <div class="pitch-wrap" id="wrap">
    <canvas id="cv" aria-label="Voetbalveld. Tik waar jij moet staan." data-fr-aria="Terrain de foot. Touche l’endroit où te placer."></canvas>
    <div class="banner" id="banner" hidden></div>
  </div>
  <div class="dock">
    <p class="prompt" id="prompt"></p>
    <div class="choices" id="choices" hidden>
      <button class="choice o" id="btnOpen" data-fr="OUVRIR">OPEN</button>
      <button class="choice d" id="btnDicht" data-fr="FERMER">DICHT</button>
    </div>
    <div class="feedback" id="fb" hidden>
      <h2 id="fbTitle"></h2>
      <p id="fbTip"></p>
      <button class="go" id="fbGo" data-fr="Suite">Verder</button>
    </div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <h2 id="rTitle"></h2>
  <div class="final" id="rScore"></div>
  <div id="rStars" role="img"></div>
  <div class="tally">
    <div class="o"><b id="rOpen"></b><span data-fr="fois bien ouvert">keer goed open</span></div>
    <div class="d"><b id="rDicht"></b><span data-fr="fois bien fermé">keer goed dicht</span></div>
  </div>
  <p id="rTip"></p>
  <div class="actions">
    <button class="btn" id="rMenu" data-fr="Autre poste">Andere plek</button>
    <button class="btn main" id="rAgain" data-fr="Encore un match">Nog een match</button>
  </div>
</section>

<script>
"use strict";
/* ========== Language ========== */
let lang='nl';
const t=(nl,fr)=>lang==='fr'?fr:nl, p2=a=>lang==='fr'?a[1]:a[0];
const $=id=>document.getElementById(id);

const GK=R('gk','GK',50,133,1,'Doelman','Gardien','Keeper','Gardien');
const FORMATS={

/* ========== Setup flow ========== */
const setup={name:store.get('veld-name',''),club:store.get('veld-club',''),fmt:store.get('veld-fmt',5),pos:store.get('veld-pos',null),step:1};
if(!FORMATS[setup.fmt])setup.fmt=5;
const G_fmt=()=>setup.fmt;
let G=null,deciding=null,token=0,goTimer=0,advance=null,tempo=store.get('veld-tempo','match');
const slotOf=()=>FORMATS[setup.fmt].slots.find(s=>s.id===setup.pos);
const roleName=s=>t(s.nl,s.fr);
function show(id){['setup','play','result'].forEach(s=>$(s).hidden=s!==id);if(id==='play')resize()}
function goStep(n){
  setup.step=n;[1,2,3,4].forEach(i=>$('s'+i).hidden=i!==n);
  [...$('steps').children].forEach((el,i)=>el.classList.toggle('on',i<n));
  $('back').hidden=n===1;
  if(n===2)renderFormats();if(n===3)renderPicker();if(n===4)renderLevels();
  if(n===1)updateHero();
  $('s'+n).scrollTop=0;
}
function updateHero(){const v=$('nameInput').value.trim();$('heroName').textContent=v||t('Jij','Toi')}
function renderFormats(){
  const box=$('formats');box.innerHTML='';
  [5,8,11].forEach(k=>{
    const f=FORMATS[k],b=document.createElement('button');b.className='fmt';b.id='fmt'+k;
    const dots=f.slots.map(s=>`<circle cx="${s.x}" cy="${s.y*.7}" r="${k===11?4:5}" fill="${s.role==='GK'?'#ffe34d':'#e0212f'}" stroke="#fff" stroke-width="1.2"/>`).join('');
    b.innerHTML=`<svg viewBox="0 0 100 98" aria-hidden="true"><rect width="100" height="98" fill="#2a8d4f"/><path d="M0 49H100" stroke="#fff" stroke-opacity=".7"/><circle cx="50" cy="49" r="9" fill="none" stroke="#fff" stroke-opacity=".7"/>${dots}</svg><span><strong>${p2(f.name)}</strong><small>${p2(f.sub)}</small></span>`;
    b.onclick=()=>{if(setup.fmt!==k)setup.pos=null;setup.fmt=k;store.set('veld-fmt',k);goStep(3)};
    box.appendChild(b);
  });
}
function renderPicker(){
  const box=$('picker'),f=FORMATS[setup.fmt];box.innerHTML='';
  const my=y=>((y-22)/118*100);
  box.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 100 118" aria-hidden="true" preserveAspectRatio="none"><g fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".6"><path d="M0 48H100"/><circle cx="50" cy="48" r="10"/><rect x="24" y="96" width="52" height="19"/><rect x="38" y="115" width="24" height="3" fill="#fff" fill-opacity=".5"/></g></svg>`);
  f.slots.forEach(s=>{
    const b=document.createElement('button');b.className='spot';b.id='spot-'+s.id;
    b.style.left=clamp(s.x,10,90)+'%';b.style.top=clamp(my(s.y),8,94)+'%';
    b.setAttribute('aria-pressed',setup.pos===s.id);b.setAttribute('aria-label',roleName(s));
    b.innerHTML=`<b>${s.no}</b><span>${t(s.sn,s.sf)}</span>`;
    b.onclick=()=>{setup.pos=s.id;store.set('veld-pos',s.id);renderPicker()};
    box.appendChild(b);
  });
  const sel=slotOf();
  $('roleInfo').innerHTML=sel?`<strong></strong><span></span>`:`<span></span>`;
  if(sel){$('roleInfo').querySelector('strong').textContent=roleName(sel);$('roleInfo').querySelector('span').textContent=p2(ROLE_INFO[sel.role])}
  else $('roleInfo').querySelector('span').textContent=t('Op welke plek speel jij in de match?','À quelle place joues-tu en match ?');
  $('toLevel').disabled=!sel;
}
const starText=n=>'★'.repeat(n)+'☆'.repeat(3-n);
function renderLevels(){
  const sel=slotOf();
  $('summary').textContent=`${setup.name} · ${p2(FORMATS[setup.fmt].name)} · ${sel?roleName(sel):''}`;
  const box=$('levels');box.innerHTML='';
  LEVELS.forEach((l,i)=>{
    const n=store.get(`veld-stars-${setup.fmt}-${i}`,0),b=document.createElement('button');b.className='level';b.id='level'+i;
    b.innerHTML=`<span class="num">${i+1}</span><span><strong>${p2(l.n)}</strong><small>${p2(l.s)}</small></span><span class="stars" aria-label="${n}/3">${starText(n)}</span>`;
    b.onclick=()=>startMatch(i);box.appendChild(b);
  });
}
function setLang(l){
  lang=l;store.set('veld-lang',l);document.documentElement.lang=l;
  document.querySelectorAll('[data-fr]').forEach(el=>{if(el._nl===undefined)el._nl=el.innerHTML;el.innerHTML=l==='fr'?el.dataset.fr:el._nl});
  document.querySelectorAll('[data-fr-aria]').forEach(el=>{if(el._nlA===undefined)el._nlA=el.getAttribute('aria-label');el.setAttribute('aria-label',l==='fr'?el.dataset.frAria:el._nlA)});
  document.querySelectorAll('[data-fr-ph]').forEach(el=>{if(el._nlP===undefined)el._nlP=el.placeholder;el.placeholder=l==='fr'?el.dataset.frPh:el._nlP});
  $('langNl').setAttribute('aria-pressed',l==='nl');$('langFr').setAttribute('aria-pressed',l==='fr');
  $('nameErr').textContent='';bg=null;updateHero();
}
function setTempo(v){tempo=v;store.set('veld-tempo',v);$('tempoSlow').setAttribute('aria-pressed',v==='slow');$('tempoMatch').setAttribute('aria-pressed',v!=='slow')}
function commitName(){
  const n=$('nameInput').value.trim().replace(/\s+/g,' ');
  if(!n){$('nameErr').textContent=t('Schrijf eerst je naam.','Écris d’abord ton prénom.');$('nameInput').focus();return false}
  setup.name=n;setup.club=$('clubInput').value.trim();store.set('veld-name',n);store.set('veld-club',setup.club);$('nameErr').textContent='';return true;
}

/* ========== Match flow ========== */
function setDock(prompt,choices){$('prompt').textContent=prompt||'';$('prompt').hidden=!prompt;$('choices').hidden=!choices;$('fb').hidden=true}
function banner(s,big){const b=$('banner');b.textContent=s;b.className='banner'+(big?' big':'');b.hidden=false}
const hideBanner=()=>{$('banner').hidden=true};
function updateScore(){$('sHome').textContent=G.us;$('sAway').textContent=G.them}
function setBar(p){const b=$('timeBar');b.style.transform=`scaleX(${clamp(p,0,1)})`;b.style.background=p>.5?'var(--good)':p>.25?'var(--open)':'var(--bad)'}
function clearScene(){view={};particles=[];flash=0;shake=0;ball.owner=null;ball.from=ball.to=null;ball.z=0}
async function startMatch(lv){
  const my=++token;tweens.forEach(x=>x.res());tweens=[];
  try{speechSynthesis.cancel()}catch(e){}
  buildTeams();clearScene();bg=null;
  G={lv,us:0,them:0,i:0,pts:0,open:0,dicht:0,list:pickSituations()};
  $('tHome').textContent=(setup.club||t('THUIS','NOUS')).toUpperCase();
  audio();updateScore();setBar(1);setDock('');show('play');
  const sel=slotOf();$('chip').textContent=`${setup.name} · ${roleName(sel)}`;
  banner(roleName(sel));roar(1.2,.06);sfx.whistle();
  await wait(1100);if(my!==token)return;hideBanner();
  for(G.i=0;G.i<G.list.length;G.i++){await playAction(G.list[G.i],my);if(my!==token)return}
  if(my===token)finish();
}
async function playAction(sit,my){
  view={};setDock('');hideBanner();ball.owner=null;ball.from=ball.to=null;ball.z=0;
  const lvl=LEVELS[G.lv],total=(lvl.time[0]+(lvl.time[1]-lvl.time[0])*(G.i/(ACTIONS-1)))*(tempo==='slow'?1.7:1)*1000;
  setBar(1);
  const c=compose(sit,slotOf());
  const moves=[];
  c.pos.us.forEach((o,i)=>moves.push(tween(us[i],{x:o.x,y:o.y},700)));
  c.pos.them.forEach((o,i)=>moves.push(tween(them[i],{x:o.x,y:o.y},700)));
  const carrier=c.isOpen?us[c.carrier]:them[c.carrier];
  moves.push(tween(ball,{x:c.ball[0],y:c.ball[1]},700));
  await Promise.all(moves);if(my!==token)return;
  ball.owner=carrier;
  const who=c.isOpen?t('WIJ hebben de bal.','ON a le ballon.'):t('ZIJ hebben de bal.','ILS ont le ballon.');
  if(G.lv===0)setDock(who,true);
  if(G.lv===1){setDock(who+' '+t('Tik op de beste ring!','Touche le meilleur cercle !'));view.rings=shuffle([{x:c.ideal.x,y:c.ideal.y,good:true},...c.decoys.map(d=>({x:d.x,y:d.y,tip:d.tip}))])}
  if(G.lv===2)setDock(t('Tik waar jij moet staan!','Touche où tu dois te placer !'));
  sfx.kick();
  const dir=carrier.gk?0:(c.isOpen?-5:5);
  if(dir)tween(carrier,{y:carrier.y+dir},total,'l');
  const t0=clock;
  const answer=await new Promise(res=>{deciding={t0,total,res,c}});
  deciding=null;if(my!==token)return;
  hideBanner();$('choices').hidden=true;$('prompt').hidden=true;view.rings=null;setBar(0);
  await resolveAction(c,answer,clock-t0,total,carrier,my);
}
function judge(c,a){
  const f=FORMATS[setup.fmt];let [good,close]=f.radius;if(c.role==='GK'){good*=.72;close*=.72}
  if(a.kind==='late')return{res:'late',spot:null,tip:c.tip};
  if(a.kind==='btn'){const right=a.v===c.s;return right?{res:'good',spot:c.ideal,tip:c.tip}:{res:'wrong',spot:{x:c.decoys[0].x,y:c.decoys[0].y},tip:c.isOpen?['Wij hebben de bal. Dus OPEN!','On a le ballon. Donc OUVRIR !']:['Zij hebben de bal. Dus DICHT!','Ils ont le ballon. Donc FERMER !']}}
  if(a.kind==='ring')return a.ring.good?{res:'good',spot:c.ideal,tip:c.tip}:{res:'wrong',spot:{x:a.ring.x,y:a.ring.y},tip:a.ring.tip};
  const p={x:a.x,y:a.y},d=dist(p,c.ideal);
  if(d<=good)return{res:'good',spot:p,tip:c.tip};
  if(d<=close)return{res:'close',spot:p,tip:c.tip};
  let near=null,best=18;c.decoys.forEach(x=>{const v=dist(p,x);if(v<best){best=v;near=x.tip}});
  return{res:'wrong',spot:p,tip:near||(c.isOpen?['Zoek meer ruimte, ver van de bal.','Cherche plus d’espace, loin du ballon.']:['Kom terug. Sta tussen de bal en ons doel.','Reviens. Place-toi entre le ballon et notre but.'])};
}
async function resolveAction(c,a,ms,total,carrier,my){
  const j=judge(c,a),isOpen=c.isOpen,alive=()=>my===token;
  if(j.spot){view.marker=a.kind==='tap'?{x:j.spot.x,y:j.spot.y}:null;await tween(me,{x:j.spot.x,y:j.spot.y},Math.min(620,dist(me,j.spot)*9+140));if(!alive())return;view.marker=null}
  us.forEach((m,i)=>{
    if(m===carrier||m===me||m.gk||i===c.presser)return;
    if(isOpen)tween(m,{x:clamp(50+(m.x-50)*1.18,5,95),y:clamp(m.y-5,10,128)},560);
    else{const cx=50+(ball.x-50)*.3;tween(m,{x:cx+(m.x-cx)*.82,y:clamp(m.y+4,10,128)},560)}
  });
  view.hull=true;view.hullColor=isOpen?'#ffc928':'#7fe7ea';
  const fast=ms<total*.5;let title,kind;
  if(j.res==='good'){
    kind='good';G.pts+=fast?3:2;
    if(isOpen){G.open++;const scored=await sceneGoal(carrier,my);if(!alive())return;title=scored?rnd([t(`Goal van ${setup.name}!`,`But de ${setup.name} !`),t('Amai, goal!','Waouh, but !')]):rnd([t(`Assist van ${setup.name}!`,`Passe décisive de ${setup.name} !`),t('Schoon open!','Belle ouverture !')])}
    else{G.dicht++;await sceneWin(my);if(!alive())return;title=rnd([t('Bal gepakt!','Ballon récupéré !'),t('Goed dicht!','Bien fermé !'),t(`Sterk, ${setup.name}!`,`Bravo, ${setup.name} !`)])}
  }else if(j.res==='close'){
    kind='close';G.pts+=1;title=t('Bijna!','Presque !');view.ghost=c.ideal;
    if(isOpen)await scenePass(me,my);else await sceneKeeper(carrier,my);if(!alive())return;
  }else{
    kind='bad';title=j.res==='late'?t('Te laat!','Trop tard !'):(isOpen?t('Bal kwijt!','Ballon perdu !'):t('Tegengoal!','But encaissé !'));
    if(isOpen)await sceneLost(carrier,my);else await sceneAgainst(carrier,my);if(!alive())return;
    view.ghost=c.ideal;
  }
  await feedback(title,p2(j.tip),kind,my);
}
async function kick(tx,ty,dur,h=2){ball.owner=null;ball.from={x:ball.x,y:ball.y};ball.to={x:tx,y:ty};ball.h=h;sfx.kick();await tween(ball,{x:tx,y:ty},dur,'out');ball.from=ball.to=null;ball.z=0}
async function scenePass(target,my){await kick(target.x,target.y,500);if(my!==token)return;ball.owner=target;sfx.good();await wait(350)}
async function sceneGoal(carrier,my){
  await kick(me.x,me.y,dist(ball,me)*7+220);if(my!==token)return false;ball.owner=me;
  let shooter=me,scored=true;
  if(me.y>64){
    /* From deep, you make the pass and your striker finishes. */
    scored=false;shooter=us.filter(a=>a!==me&&!a.gk).sort((a,b)=>a.y-b.y)[0];
    tween(shooter,{x:clamp(shooter.x,28,72),y:30},700);
    await wait(180);if(my!==token)return false;
    await kick(clamp(shooter.x,28,72),30,520,3.5);if(my!==token)return false;ball.owner=shooter;
  }else{
    await tween(me,{x:clamp(me.x+(50-me.x)*.55,10,90),y:Math.min(me.y,30)},560);if(my!==token)return false;
  }
  const shot={x:FORMATS[setup.fmt].line[0]+3+Math.random()*14,y:3};
  tween(gkThem,{x:50+(shot.x>50?-8:8)},300);
  await kick(shot.x,shot.y,330,4);if(my!==token)return false;
  G.us++;updateScore();sfx.goal();celebrate();banner(t('GOAL!','BUT !'),true);await wait(1050);hideBanner();
  return scored;
}
async function sceneWin(my){await kick(me.x,me.y,dist(ball,me)*6+200,0.5);if(my!==token)return;ball.owner=me;sfx.good();await wait(650)}
async function sceneKeeper(carrier,my){
  await tween(carrier,{y:clamp(carrier.y+14,10,112)},420);if(my!==token)return;
  await kick(gkUs.x,gkUs.y,380,2.5);if(my!==token)return;ball.owner=gkUs;await wait(300);
}
async function sceneLost(carrier,my){
  const mid={x:(carrier.x+me.x)/2,y:(carrier.y+me.y)/2};
  let o=them[1],b=1e9;them.forEach(x=>{if(x.gk)return;const v=dist(x,mid);if(v<b){b=v;o=x}});
  tween(o,{x:mid.x,y:mid.y},430);await kick(mid.x,mid.y,430,1.5);if(my!==token)return;
  ball.owner=o;sfx.bad();await wait(450);
}
async function sceneAgainst(carrier,my){
  if(carrier.y<62){
    /* Far from our goal, they pass to their deepest forward first. */
    const fw=them.filter(a=>a!==carrier&&!a.gk).sort((a,b)=>b.y-a.y)[0];
    const tx=fw.x,ty=Math.max(fw.y,92);tween(fw,{x:tx,y:ty},520);
    await kick(tx,ty,520,3);if(my!==token)return;ball.owner=fw;carrier=fw;
  }
  await tween(carrier,{x:50+(carrier.x-50)*.55,y:112},520);if(my!==token)return;
  tween(gkUs,{x:40},240);
  await kick(FORMATS[setup.fmt].line[1]-3,137.5,320,2.5);if(my!==token)return;
  G.them++;updateScore();sfx.bad();shake=reduced?0:4;await wait(700);
}
function feedback(title,tip,kind,my){return new Promise(res=>{
  $('prompt').hidden=true;$('choices').hidden=true;$('fb').hidden=false;$('fb').className='feedback '+kind;$('fbTitle').textContent=title;$('fbTip').textContent=tip;
  if(kind==='good')sfx.good();speak(title+' '+tip);
  let fin=false;
  advance=()=>{if(fin)return;fin=true;clearTimeout(goTimer);advance=null;view.hull=null;view.ghost=null;res()};
  if(kind==='good')goTimer=setTimeout(()=>{if(my===token&&advance)advance()},2600);
})}
function finish(){
  const r=G.pts/(ACTIONS*3),n=r>=.7?3:r>=.45?2:r>=.2?1:0,key=`veld-stars-${setup.fmt}-${G.lv}`;if(n>store.get(key,0))store.set(key,n);
  $('rTitle').textContent=G.us>G.them?t('Gewonnen!','Gagné !'):G.us===G.them?t('Gelijkspel!','Match nul !'):t('Verloren','Perdu');
  $('rScore').textContent=`${$('tHome').textContent} ${G.us} - ${G.them} ${t('GAST','ADV')}`;
  $('rStars').textContent=starText(n);$('rStars').setAttribute('aria-label',n+'/3');
  $('rOpen').textContent=`${G.open}/4`;$('rDicht').textContent=`${G.dicht}/4`;
  $('rTip').textContent=G.open===4&&G.dicht===4?t(`Alles goed, ${setup.name}! Jij bent een baas op het veld.`,`Tout est bon, ${setup.name} ! Tu es un chef sur le terrain.`):G.open<G.dicht?t('Oefen OPEN: wij hebben de bal, maak het veld groot.','Entraîne-toi à OUVRIR : on a le ballon, rends le terrain grand.'):G.dicht<G.open?t('Oefen DICHT: zij hebben de bal, maak het veld klein.','Entraîne-toi à FERMER : ils ont le ballon, rends le terrain petit.'):t('Kijk altijd eerst: wie heeft de bal?','Regarde toujours d’abord : qui a le ballon ?');
  sfx.whistle();show('result');
}

/* ========== Input ========== */
cv.addEventListener('pointerdown',e=>{
  if(!deciding||G.lv===0)return;
  const r=cv.getBoundingClientRect(),q=unproj(e.clientX-r.left,e.clientY-r.top);
  if(G.lv===1){let best=null,bd=20;view.rings.forEach(o=>{const v=Math.hypot(o.x-q.x,o.y-q.y);if(v<bd){bd=v;best=o}});if(best)deciding.res({kind:'ring',ring:best})}
  else deciding.res({kind:'tap',x:clamp(q.x,5,95),y:clamp(q.y,6,136)});
});
$('btnOpen').onclick=()=>{if(deciding)deciding.res({kind:'btn',v:'open'})};
$('btnDicht').onclick=()=>{if(deciding)deciding.res({kind:'btn',v:'dicht'})};
$('fbGo').onclick=()=>{if(advance)advance()};
$('soundHome').onclick=toggleSound;$('soundPlay').onclick=toggleSound;
$('nameInput').addEventListener('input',()=>{$('nameErr').textContent='';updateHero()});
$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('toFormat').click()}});
$('toFormat').onclick=()=>{if(commitName()){audio();goStep(2)}};
$('toLevel').onclick=()=>{if(slotOf())goStep(4)};
$('back').onclick=()=>goStep(setup.step-1);
$('quit').onclick=()=>{token++;deciding=null;advance=null;clearTimeout(goTimer);tweens.forEach(x=>x.res());tweens=[];clearScene();try{speechSynthesis.cancel()}catch(e){}hideBanner();show('setup');goStep(4)};
$('rMenu').onclick=()=>{show('setup');goStep(3)};
$('rAgain').onclick=()=>startMatch(G.lv);
$('langNl').onclick=()=>setLang('nl');$('langFr').onclick=()=>setLang('fr');
$('tempoSlow').onclick=()=>setTempo('slow');$('tempoMatch').onclick=()=>setTempo('match');

/* ========== Loop ========== */
function frame(ts){
  clock=ts;stepTweens();
  if(deciding){const left=1-(clock-deciding.t0)/deciding.total;setBar(left);if(left<=0)deciding.res({kind:'late'})}
  if(!$('play').hidden&&cv.width>10&&us.length)draw();
  requestAnimationFrame(frame);
}
$('nameInput').value=setup.name;$('clubInput').value=setup.club;
setSoundIcons();setTempo(tempo);setLang(store.get('veld-lang','nl')==='fr'?'fr':'nl');goStep(1);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{bg=null});
requestAnimationFrame(frame);
</script>
